# Dedicated disposable E2E database only. Run with project iqoqo-e2e-test.
services:
  e2e-db:
    image: postgres:18-alpine
    restart: "no"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - e2e_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: iqoqo_e2e
      POSTGRES_PASSWORD: e2e_local_only
      POSTGRES_DB: iqoqo_e2e_test
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iqoqo_e2e -d iqoqo_e2e_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  e2e_data:
