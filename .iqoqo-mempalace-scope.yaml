# iqoqo-mempalace Scope Configuration
# ====================================
# This file defines which folders and files are indexed into the MemPalace
# knowledge graph. It is COMMITTED to git — share it across machines.
#
# To customize: edit scopes list below, then run:
#   /iqoqo-mempalace index     (full rebuild / multi-scope mine)
#   /iqoqo-mempalace update    (mine changed scopes / specific files)
#   /iqoqo-mempalace status    (check palace status)
#

# Scopes mined under project mode (--mode projects --wing iqoqo)
# Consolidated into high-level directory roots to avoid slow repeated process restarts.
scopes:
  # --- Project Code, Docs, Infrastructure (respects .gitignore) ---
  - .

  # --- Operational Notes (.context/notes/*) ---
  - .context/notes

# Scopes mined under conversation mode (--mode convos --wing iqoqo)
# Versioned AI memory subfolder auto-detected from package.json if left as .context/ai-memory
convos_scopes:
  - .context/ai-memory

# Exclude patterns applied during file collection and mining
exclude:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.venv/**"
  - "**/.pytest_cache/**"
  - "**/.mypy_cache/**"
  - "**/.ruff_cache/**"
  - "**/.coverage"
  - "**/*.egg-info/**"
  - "**/coverage/**"
  - "**/.tox/**"
  - "**/instance/**"
  - "**/data/**"
  - "**/app/static/covers/**"
  - "**/app/static/gallery/**"
  - "**/mykg_sessions/**"
  - "**/.mykg_sessions/**"
  - "**/screenshots/**"
  - "**/images/**"
  - "**/graphify-out/**"
  - "**/.DS_Store"
  - "**/Thumbs.db"
  - "**/*.log"
