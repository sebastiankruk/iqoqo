services:
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static/covers:/usr/share/nginx/html/covers:ro
    depends_on:
      - web
      - frontend

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-prod}
    restart: always
    command: >-
      sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:5000 run:app"
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./exports:/usr/src/app/exports
      - ./app/static/covers:/usr/src/app/app/static/covers
      - ./app/static/gallery:/usr/src/app/app/static/gallery

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        APP_VERSION: ${APP_VERSION:-prod}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-prod}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-https://iqoqo.cc}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-prod}
      # Explicitly force these variables into the Node runtime
      # so Next.js never falls back to 0.0.0.0
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - APP_URL=${NEXT_PUBLIC_APP_URL}
    restart: always
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-iqoqo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-iqoqo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iqoqo} -d ${POSTGRES_DB:-iqoqo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
