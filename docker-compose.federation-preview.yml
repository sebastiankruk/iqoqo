# Overlay compose file for staging multi-instance federation preview (Instance Beta)
# Usage: docker compose -f docker-compose.prebuilt.yml -f docker-compose.federation-preview.yml up -d

services:
  peer-db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=iqoqo_peer
      - POSTGRES_PASSWORD=iqoqo_peer_secret
      - POSTGRES_DB=iqoqo_peer
      - PGDATA=/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iqoqo_peer -d iqoqo_peer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - peer_postgres_data:/var/lib/postgresql/data

  peer-migration:
    image: ${IMAGE_PREFIX-ghcr.io/sebastiankruk/}iqoqo-backend:${APP_VERSION:-preview}
    restart: "no"
    command: >-
      sh -c "python scripts/fix_alembic.py && flask db upgrade && env PYTHONPATH=. python scripts/sync_db_permissions.py && env PYTHONPATH=. python scripts/init_auth.py"
    environment:
      - DATABASE_URL=postgresql://iqoqo_peer:iqoqo_peer_secret@peer-db:5432/iqoqo_peer
      - ADMIN_EMAIL=${PEER_ADMIN_EMAIL:-peer-admin@iqoqo.cc}
      - ADMIN_PASSWORD=${PEER_ADMIN_PASSWORD:-PeerBootstrapPassword123!}
      - SECRET_KEY=${PEER_SECRET_KEY:-peer-preview-secret-key-32-chars-ok}
      - JWT_SECRET_KEY=${PEER_JWT_SECRET_KEY:-peer-jwt-secret-preview-32-chars}
      - AUTH_SECRET=${PEER_AUTH_SECRET:-peer-auth-secret-preview-32-chars}
    volumes:
      - peer_data:/usr/src/app/data
    depends_on:
      peer-db:
        condition: service_healthy

  web:
    environment:
      - FEDERATION_ENABLED=true
      - FEDERATION_ALLOW_LOOPBACK=true

  peer-web:
    image: ${IMAGE_PREFIX-ghcr.io/sebastiankruk/}iqoqo-backend:${APP_VERSION:-preview}
    restart: always
    command: >-
      gunicorn --bind 0.0.0.0:5000 --workers ${GUNICORN_WORKERS:-2} --worker-class sync --threads 1 --timeout 30 run:app
    environment:
      - DATABASE_URL=postgresql://iqoqo_peer:iqoqo_peer_secret@peer-db:5432/iqoqo_peer
      - ADMIN_EMAIL=${PEER_ADMIN_EMAIL:-peer-admin@iqoqo.cc}
      - ADMIN_PASSWORD=${PEER_ADMIN_PASSWORD:-PeerBootstrapPassword123!}
      - SECRET_KEY=${PEER_SECRET_KEY:-peer-preview-secret-key-32-chars-ok}
      - JWT_SECRET_KEY=${PEER_JWT_SECRET_KEY:-peer-jwt-secret-preview-32-chars}
      - AUTH_SECRET=${PEER_AUTH_SECRET:-peer-auth-secret-preview-32-chars}
      - BASE_URL=${PEER_BASE_URL:-https://peer.iqoqo.cc}
      - NEXT_PUBLIC_FRONTEND_URL=${PEER_FRONTEND_URL:-https://peer.iqoqo.cc}
      - CORS_ORIGINS=${PEER_CORS_ORIGINS:-https://peer.iqoqo.cc,http://localhost:3001,http://localhost:3000}
      - FEDERATION_ENABLED=true
      - FEDERATION_ALLOW_LOOPBACK=true
    volumes:
      - peer_data:/usr/src/app/data
    ports:
      - "127.0.0.1:${PEER_BACKEND_PORT:-5005}:5000"
    depends_on:
      peer-db:
        condition: service_healthy
      peer-migration:
        condition: service_completed_successfully

  peer-frontend:
    image: ${IMAGE_PREFIX-ghcr.io/sebastiankruk/}iqoqo-frontend:${APP_VERSION:-preview}
    restart: always
    command: >-
      sh -c "node -e '
        const fs = require(\"fs\");
        try {
          const m = JSON.parse(fs.readFileSync(\".next/routes-manifest.json\"));
          m.rewrites.afterFiles.forEach(r => {
            if (r.source === \"/api/:path*\") r.destination = (process.env.FLASK_API_URL || \"http://peer-web:5000/api\").replace(/\\/api\\/?$$/, \"\") + \"/api/:path*\";
            if (r.source === \"/.well-known/:path*\") r.destination = (process.env.FLASK_API_URL || \"http://peer-web:5000/api\").replace(/\\/api\\/?$$/, \"\") + \"/.well-known/:path*\";
          });
          fs.writeFileSync(\".next/routes-manifest.json\", JSON.stringify(m, null, 2));
        } catch (e) { console.error(e); }
      ' && node server.js"
    environment:
      - FLASK_API_URL=http://peer-web:5000/api
      - NEXT_PUBLIC_API_URL=${PEER_NEXT_PUBLIC_API_URL:-/api}
      - NEXT_PUBLIC_FRONTEND_URL=${PEER_FRONTEND_URL:-https://peer.iqoqo.cc}
      - PORT=3000
    ports:
      - "${PEER_FRONTEND_PORT:-3001}:3000"
    depends_on:
      - peer-web

volumes:
  peer_postgres_data:
  peer_data:
