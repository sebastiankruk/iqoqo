permissions:
  - name: "config:affiliate"
    description: "Manage affiliate tracking IDs"
  - name: "config:external_apis"
    description: "Manage external API keys and integrations"
  - name: "config:federation"
    description: "Manage federation settings"
  - name: "config:internal"
    description: "Manage internal instance settings"
  - name: "delete:item"
    description: "Permanently remove a physical item from the collection."
  - name: "delete:manifestation"
    description: "Remove a specific manifestation and its associated items."
  - name: "edit:cover"
    description: "Allow opening the cover art editor to manipulate (crop/rotate/flip) and upload manifestation covers."
  - name: "escalate:request"
    description: "Submit custodian metadata escalation requests."
  - name: "escalate:resolve"
    description: "Review and resolve custodian metadata escalation requests."
  - name: "llm_generate:cloud"
    description: "Allow high-quality AI generation using cloud providers (may incur costs)."
  - name: "llm_generate:cover"
    description: "Allow generating covers using local AI models."
  - name: "llm_generate:metadata"
    description: "Extract metadata from images or existing text using AI."
  - name: "read:metadata"
    description: "Allow viewing manifestation and item metadata."
  - name: "read:owners"
    description: "View owner names (admin visibility by default)."
  - name: "read:roles"
    description: "View available roles and their assigned permissions."
  - name: "read:users"
    description: "View the list of registered users."
  - name: "refetch:metadata"
    description: "Pull fresh metadata for an existing manifestation from external sources."
  - name: "refetch:cover"
    description: "Refetch cover art from external metadata sources without AI generation."
  - name: "regenerate:cover"
    description: "Trigger regeneration of manifestation covers."
  - name: "update:item"
    description: "Modify status, condition, or local metadata of items."
  - name: "upload:cover"
    description: "Contribute or manually upload cover images."
  - name: "write:item"
    description: "Allow adding new items to the personal collection (manual entry or scanner)."
  - name: "write:metadata"
    description: "Edit central metadata for manifestations and items."
  - name: "write:roles"
    description: "Create/delete roles and assign specific permission sets."
  - name: "write:users"
    description: "Modify user roles, account activation, and status."
