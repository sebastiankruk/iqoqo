# iqoqo Docker Compose Configuration
#
# This file defines services for running iqoqo in production mode.
# Configure ports and credentials in the .env file.
#
# Usage:
#   docker-compose build          # Build the application image
#   docker-compose up -d          # Start all services in background
#   docker-compose logs -f web    # View application logs
#   docker-compose down           # Stop all services
#
# For systems requiring sudo:
#   sudo docker compose build
#   sudo docker compose up -d

services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    # Run migrations automatically before starting the application server.
    # 'flask db upgrade' is idempotent: it is safe to run on every startup.
    command: >-
      sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:5000 run:app"
    ports:
      # External:Internal port mapping
      # Configure WEB_PORT in .env (default: 5000)
      - "${WEB_PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${WEB_PORT:-5000}/api
      - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-dev}
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    ports:
      # External:Internal port mapping
      # Configure DB_PORT in .env (default: 5432)
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      # These are read from .env file
      - POSTGRES_USER=${POSTGRES_USER:-iqoqo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-iqoqo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iqoqo} -d ${POSTGRES_DB:-iqoqo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
