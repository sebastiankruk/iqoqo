services:
  nginx:
    # Custom build: adds the native nginx-module-otel for Layer 6 OTel instrumentation.
    # Falls back gracefully if the OTel Collector is not running (otel_trace is non-blocking).
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static/covers:/usr/share/nginx/html/covers:ro
    depends_on:
      - web
      - frontend

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-prod}
    restart: always
    command: >-
      sh -c "python scripts/fix_alembic.py && flask db upgrade && env PYTHONPATH=. python scripts/sync_db_permissions.py && opentelemetry-instrument gunicorn --bind 0.0.0.0:5000 --access-logfile - --error-logfile - --log-level info run:app"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - OTEL_SERVICE_NAME=iqoqo-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=${OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./exports:/usr/src/app/exports
      - ./app/static/covers:/usr/src/app/app/static/covers
      - ./app/static/gallery:/usr/src/app/app/static/gallery
      - ./scripts:/usr/src/app/scripts
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        APP_VERSION: ${APP_VERSION:-prod}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-prod}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-https://iqoqo.cc}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-prod}
      # Explicitly force these variables into the Node runtime
      # so Next.js never falls back to 0.0.0.0
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - APP_URL=${NEXT_PUBLIC_APP_URL}
      - OTEL_SERVICE_NAME=iqoqo-frontend
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-iqoqo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-iqoqo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iqoqo} -d ${POSTGRES_DB:-iqoqo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-prod}
    restart: always
    command: >-
      sh -c "opentelemetry-instrument celery -A app.core.celery_app:celery worker --loglevel=info --pool=${CELERY_POOL:-threads} --concurrency=${CELERY_CONCURRENCY:-4}"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - OTEL_SERVICE_NAME=iqoqo-celery-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=${OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED:-false}
    volumes:
      - ./exports:/usr/src/app/exports
      - ./app/static/covers:/usr/src/app/app/static/covers
      - ./app/static/gallery:/usr/src/app/app/static/gallery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
