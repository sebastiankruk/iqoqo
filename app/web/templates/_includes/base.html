<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iQoQo</title>
  <script>
    window.console = window.console || function (t) { };
  </script>
  <script>
    if (document.location.search.match(/type=embed/gi)) {
      window.parent.postMessage("resize", "*");
    }
  </script>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="{{ url_for('web.static', filename='css/bootstrap.min.css') }}">

  <link rel="stylesheet" media="screen" href="{{ url_for('web.static', filename='css/base.css') }}" />
</head>

<body translate="no" class="bg-dark page-{{ page }}">
  <!-- Bootstrap Bundle with Popper -->
  <script src="{{ url_for('web.static', filename='js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('web.static', filename='js/jquery-3.6.0.min.js') }}"></script>
  <script src="{{ url_for('web.static', filename='js/html5-qrcode.min.js') }}"></script>
  <script src="{{ url_for('web.static', filename='js/beep.js') }}"></script>
  <script src="{{ url_for('web.static', filename='js/isbn.js') }}"></script>
  
  <header class="p-3 bg-dark text-white">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
        <a href="{{ url_for('web.index') }}" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
          <span class="fs-4"><sub>i</sub>QO<sup>2</sup></span>
        </a>

        <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
          <li><a href="{{ url_for('web.index') }}" class="nav-link px-2 text-{{ 'secondary' if page == 'index' else 'white' }}">Home</a></li>
          {% if page == 'list' %}
          <li><a href="{{ url_for('web.list_query', query_name='books') }}" class="nav-link px-2 text-secondary">Books</a></li>
          {% endif %}
          <li><a href="{{ url_for('web.scan') }}" class="nav-link px-2 text-{{ 'secondary' if page == 'scan' else 'white' }}">Scan</a></li>
          <li><a href="{{ url_for('web.add') }}" class="nav-link px-2 text-{{ 'secondary' if page == 'add' else 'white' }}">Add</a></li>
          {% if page == 'update' %}
          <li><a href="{{ url_for('web.update') }}" class="nav-link px-2 text-secondary">Update</a></li>
          {% endif %}
        </ul>

        <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3">
          <input type="search" class="form-control form-control-dark" placeholder="Search..." aria-label="Search">
        </form>

      </div>
    </div>
  </header>

  <div class="container">
  {% block body %}  
  {% endblock %}
  </div>

  {% include '_includes/toast.html' %}

</body>

</html>
