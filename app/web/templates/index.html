{% extends "_includes/base.html" %}
{% block body %}
<table class="table bg-dark text-white">
  <thead>
    <tr>
      <th scope="col">type</th>
      <th scope="col">count</th>
    </tr>
  </thead>
  <tbody>
    {% for type, count in counts.items() %}
    <tr>
      <th scope="row"><a href="{{ url_for('web.list_query', query_name=type.replace(' ', '-')) }}">{{ type }}</a></th>
      <td>{{ count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
