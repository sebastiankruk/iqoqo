# iqoqo-mykg Scope Configuration
# ================================
# This file defines which folders and files are indexed into the mykg
# knowledge graph. It is COMMITTED to git — share it across machines.
#
# To customize: edit scopes list below, then run:
#   /iqoqo-mykg index     (full rebuild)
#   /iqoqo-mykg grow      (append changed with schema expansion)
#   /iqoqo-mykg update    (append changed with locked schema)
#
# Runtime state (manifests, caches) lives in .iqoqo-mykg/ which is gitignored.

scopes:
  # --- Documentation ---
  - docs

  # --- Operational Notes (.context/notes/* via symlink to Dropbox) ---
  - .context/notes/sre
  - .context/notes/bugs
  - .context/notes/code
  - .context/notes/design
  - .context/notes/dev
  - .context/notes/marketing
  - .context/notes/openspec
  - .context/notes/plan
  - .context/notes/review
  - .context/notes/security
  - .context/notes/tests
  - .context/notes/tools

  # --- Versioned AI Memory (.context/ai-memory/<version> via symlink) ---
  # Note: specify the version explicitly, or use auto-detection by omitting
  #       (auto-detect reads version from package.json)
  - .context/ai-memory/0.7.17

  # --- Application Code ---
  - app
  - frontend
  - migrations

  # --- Infrastructure & Deployment ---
  - deploy
  - scripts
  - docker-compose.yml
  - docker-compose.*.yml
  - Dockerfile*
  - .dockerignore

  # --- Build & Orchestration ---
  - Makefile

# Exclude patterns applied during file collection
# (supplements built-in exclusions like __pycache__, node_modules)
exclude:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.venv/**"
  - "**/.pytest_cache/**"
  - "**/.mypy_cache/**"
  - "**/.ruff_cache/**"
  - "**/.coverage"
  - "**/*.egg-info/**"
  - "**/coverage/**"
  - "**/.tox/**"
  - "**/instance/**"
  - "**/data/**"
  - "**/covers/**"
  - "**/static/covers/**"
  - "**/static/gallery/**"
  - "**/static/uploads/**"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.png"
  - "**/*.gif"
  - "**/*.webp"
  - "**/*.ico"
  - "**/.DS_Store"
  - "**/Thumbs.db"
  - "**/*.log"
  - "**/graphify-out/**"
  - "**/mykg_sessions/**"
  - "**/.mykg_sessions/**"
