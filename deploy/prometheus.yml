global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "flask-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["web:5000", "host.docker.internal:5000"]

  - job_name: "nextjs-frontend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["frontend:3000", "host.docker.internal:3000"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
