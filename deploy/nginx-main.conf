#
# Nginx main configuration with native OpenTelemetry module (Layer 6 instrumentation).
#
# This file replaces /etc/nginx/nginx.conf in the custom nginx container built from
# deploy/Dockerfile.nginx. It loads the OTel C-module, configures the OTLP exporter
# to push traces to the OTel Collector via gRPC, and includes the iqoqo reverse-proxy
# virtual host config from /etc/nginx/conf.d/*.conf unchanged.
#
# Trace IDs and span IDs are injected into the access log format so they are
# automatically tailed by the OTel Collector's log pipeline.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

# Load the native OpenTelemetry C-module.
# Installed by: apt-get install nginx-module-otel (from nginx.org repo, see Dockerfile.nginx)
load_module modules/ngx_otel_module.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── OpenTelemetry Configuration ─────────────────────────────────────────
    # Export traces via gRPC to the OTel Collector container (internal network).
    # This generates the first span of every request trace — before Flask or
    # Next.js ever see the connection.
    otel_exporter {
        endpoint otel-collector:4317;
    }

    otel_trace on;
    otel_service_name iqoqo-nginx-edge;

    # Inject OTel trace/span IDs into the access log for log-trace correlation.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'trace_id=$otel_trace_id span_id=$otel_span_id';

    access_log  /var/log/nginx/access.log  main;

    # Docker internal DNS resolver — re-resolve service hostnames periodically
    # so nginx picks up new container IPs after restarts without a reload.
    resolver 127.0.0.11 valid=30s ipv6=off;

    sendfile        on;
    keepalive_timeout  65;

    # ─── Application Virtual Hosts ─────────────────────────────────────────
    # Load the existing iqoqo reverse-proxy routing config (deploy/nginx.conf),
    # which is mounted read-only at /etc/nginx/conf.d/default.conf by docker-compose.yml.
    # This file is unchanged — OTel instrumentation is purely additive.
    include /etc/nginx/conf.d/*.conf;
}
