upstream iqoqo_api {
	server web:5000;
}

upstream iqoqo_frontend {
	server frontend:3000;
}

# Smart protocol mapping: Use Cloudflare's HTTPS if available, otherwise fallback to local scheme
map $http_x_forwarded_proto $mapped_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
	listen 80;
	server_name _;

	client_max_body_size 20m;

	location /api/ {
		proxy_pass http://iqoqo_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Use the mapped protocol
		proxy_set_header X-Forwarded-Proto $mapped_proto;
	}

	location / {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Use the mapped protocol
		proxy_set_header X-Forwarded-Proto $mapped_proto;
	}
}
