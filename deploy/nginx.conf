# Docker DNS resolver: re-resolve service hostnames every 30s so nginx
# automatically picks up new container IPs after restarts or scaling events.
# Without `resolve`, nginx caches the IP resolved at startup forever,
# causing 502s when backend containers get new IPs.
upstream iqoqo_api {
	zone iqoqo_api 64k;
	resolver 127.0.0.11 valid=30s ipv6=off;
	server web:5000 resolve;
}

upstream iqoqo_frontend {
	zone iqoqo_frontend 64k;
	resolver 127.0.0.11 valid=30s ipv6=off;
	server frontend:3000 resolve;
}

# OpenObserve is only present when the monitoring compose file is composed
# alongside the main stack. A variable here makes nginx start cleanly when it is
# absent instead of failing on an unresolvable upstream at startup.
upstream iqoqo_openobserve {
	zone iqoqo_openobserve 64k;
	resolver 127.0.0.11 valid=30s ipv6=off;
	server openobserve:5080 resolve;
}

# Smart protocol mapping: Use Cloudflare's HTTPS if available, otherwise fallback to local scheme
map $http_x_forwarded_proto $mapped_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate limiting zones, keyed per client IP. Sized at 10m (~160k tracked IPs)
# which is ample for a self-hosted instance.
#   api_general: baseline for all /api/ traffic.
#   api_scanner: /api/scan is comparatively expensive (barcode/OCR lookups,
#     external metadata fetches) and accepts multi-image uploads, so it gets
#     its own tighter budget independent of general API traffic.
#   api_rum: /rum/ is the OpenObserve RUM/Logs ingest endpoint. It is
#     unauthenticated by construction — the client token is public — so it gets
#     the tightest budget of the three to bound abuse volume.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_scanner:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_rum:10m rate=10r/s;

server {
	listen 80;
	server_name _;

	client_max_body_size 60M;

	# --- NEXT.JS API EXCEPTION ROUTES ---
	location = /api/auth-exchange {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		# Give Next.js the explicit forwarded host
		proxy_set_header X-Forwarded-Host $http_host;
	}

	location = /api/auth/logout {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}
	# ------------------------------------

	# --- SCANNER (multi-image uploads, tighter rate limit) ---
	location /api/scan {
		client_max_body_size 25m;
		limit_req zone=api_scanner burst=5 nodelay;
		proxy_pass http://iqoqo_api;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}

	# --- FLASK API ROUTES ---
	location /api/ {
		limit_req zone=api_general burst=20 nodelay;
		proxy_pass http://iqoqo_api;
		proxy_http_version 1.1;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}

	# --- STATIC COVERS (Direct from disk) ---
	location /api/static/covers/ {
		alias /usr/share/nginx/html/covers/;
		expires 30d;
		add_header Cache-Control "public, no-transform";
	}

	# Also handle /static/covers/ for frontend
	location /static/covers/ {
		alias /usr/share/nginx/html/covers/;
		expires 30d;
		add_header Cache-Control "public, no-transform";
	}

	# --- STATIC GALLERY (Direct from disk) ---
	location /api/static/gallery/ {
		alias /usr/share/nginx/html/gallery/;
		expires 30d;
		add_header Cache-Control "public, no-transform";
	}

	# Also handle /static/gallery/ for frontend
	location /static/gallery/ {
		alias /usr/share/nginx/html/gallery/;
		expires 30d;
		add_header Cache-Control "public, no-transform";
	}

    # --- OPENOBSERVE RUM INGEST ---
	#
	# Browser RUM and Logs ingest. OpenObserve is bound to loopback inside the
	# compose network, so without this route an end user's browser has nowhere
	# to send telemetry in a dockerized deployment and RUM is silently dead.
	#
	# This is an *unauthenticated write endpoint*: the RUM client token is a
	# public credential embedded in the browser bundle, so anyone who can read
	# it can post events here. It therefore gets its own tight rate limit
	# (independent of api_scanner) and is never cached.
	#
	# `resolver` re-resolves the container IP every 30s so this survives
	# OpenObserve restarts and rescheduling, matching the other upstreams.
	location /rum/ {
		limit_req zone=api_rum burst=20 nodelay;

		proxy_pass http://iqoqo_openobserve;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_read_timeout 30s;
		proxy_send_timeout 30s;

		# Ingest traffic must never be cached or buffered by the proxy.
		proxy_buffering off;
		proxy_request_buffering off;
		add_header Cache-Control "no-store" always;
	}

    # --- NEXT.JS IMMUTABLE STATIC ASSETS ---
	# Content-hashed filenames: cache indefinitely in the browser.
	location /_next/static/ {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# --- NEXT.JS DYNAMIC ROUTES (Server Actions, RSC payloads, HMR) ---
	# These must never be cached; stale IDs cause "Failed to find Server Action" floods.
	location /_next/ {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

    # --- NEXT.JS FRONTEND PAGES ---
	location / {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}
}
