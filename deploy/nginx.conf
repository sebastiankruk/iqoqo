upstream iqoqo_api {
	server web:5000;
}

upstream iqoqo_frontend {
	server frontend:3000;
}

# Smart protocol mapping: Use Cloudflare's HTTPS if available, otherwise fallback to local scheme
map $http_x_forwarded_proto $mapped_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate limiting zones, keyed per client IP. Sized at 10m (~160k tracked IPs)
# which is ample for a self-hosted instance.
#   api_general: baseline for all /api/ traffic.
#   api_scanner: /api/scan is comparatively expensive (barcode/OCR lookups,
#     external metadata fetches) and accepts multi-image uploads, so it gets
#     its own tighter budget independent of general API traffic.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_scanner:10m rate=5r/s;

server {
	listen 80;
	server_name _;

	client_max_body_size 20m;

	# --- NEXT.JS API EXCEPTION ROUTES ---
	location = /api/auth-exchange {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		# Give Next.js the explicit forwarded host
		proxy_set_header X-Forwarded-Host $http_host;
	}

	location = /api/auth/logout {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}
	# ------------------------------------

	# --- SCANNER (multi-image uploads, tighter rate limit) ---
	location /api/scan {
		client_max_body_size 25m;
		limit_req zone=api_scanner burst=5 nodelay;
		proxy_pass http://iqoqo_api;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}

	# --- FLASK API ROUTES ---
	location /api/ {
		limit_req zone=api_general burst=20 nodelay;
		proxy_pass http://iqoqo_api;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}

	# --- STATIC COVERS (Direct from disk) ---
	location /api/static/covers/ {
		alias /usr/share/nginx/html/covers/;
		expires 30d;
		add_header Cache-Control "public, no-transform";
	}

	# Also handle /static/covers/ for frontend
	location /static/covers/ {
		alias /usr/share/nginx/html/covers/;
		expires 30d;
		add_header Cache-Control "public, no-transform";
	}

    # --- NEXT.JS IMMUTABLE STATIC ASSETS ---
	# Content-hashed filenames: cache indefinitely in the browser.
	location /_next/static/ {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# --- NEXT.JS DYNAMIC ROUTES (Server Actions, RSC payloads, HMR) ---
	# These must never be cached; stale IDs cause "Failed to find Server Action" floods.
	location /_next/ {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

    # --- BLOCK PUBLIC ACCESS TO METRICS ---
	location = /metrics {
		return 404;
	}

    # --- NEXT.JS FRONTEND PAGES ---
	location / {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}
}
