upstream iqoqo_api {
	server web:5000;
}

upstream iqoqo_frontend {
	server frontend:3000;
}

# Smart protocol mapping: Use Cloudflare's HTTPS if available, otherwise fallback to local scheme
map $http_x_forwarded_proto $mapped_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
	listen 80;
	server_name _;

	client_max_body_size 20m;

	# --- NEXT.JS API EXCEPTION ROUTES ---
	location = /api/auth-exchange {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		# Give Next.js the explicit forwarded host
		proxy_set_header X-Forwarded-Host $http_host;
	}

	location = /api/auth/logout {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}
	# ------------------------------------

	# --- FLASK API ROUTES ---
	location /api/ {
		proxy_pass http://iqoqo_api;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}

	# --- STATIC COVERS (Direct from disk) ---
	location /api/static/covers/ {
		alias /usr/share/nginx/html/covers/;
		expires 30d;
		add_header Cache-Control "public, no-transform";
	}

    # --- NEXT.JS FRONTEND PAGES ---
	location / {
		proxy_pass http://iqoqo_frontend;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $mapped_proto;
		proxy_set_header X-Forwarded-Host $http_host;
	}
}
