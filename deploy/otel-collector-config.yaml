receivers:
  otlp:
    protocols:
      grpc:
      http:
  redis:
    endpoint: "redis:6379"
    collection_interval: 10s
  postgresql:
    endpoint: "db:5432"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    databases:
      - "${POSTGRES_DB}"
    collection_interval: 10s
  docker_stats:
    endpoint: "unix:///var/run/docker.sock"
    collection_interval: 10s
    env_vars_to_metric_labels:
      - COMPOSE_SERVICE

exporters:
  otlphttp/dynatrace:
    endpoint: "${DT_ENDPOINT}"
    headers:
      Authorization: "Api-Token ${DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/dynatrace]
    metrics:
      receivers: [redis, postgresql, docker_stats]
      exporters: [otlphttp/dynatrace]
