# OpenTelemetry Collector — Production Config (OpenObserve backend)
#
# PURPOSE: Full 8-layer observability config for production Docker Compose
#          deployments where all services are on the iqoqo_default network.
#
# Usage:
#   - Reference in docker-compose.yml (prod) via:
#     volumes:
#       - ./deploy/otel-collector-prod.yaml:/etc/otelcol-contrib/config.yaml:ro
#
# All 8 observability layers:
#   - Layer 1: Frontend SSR (Next.js)          via OTLP push from app container
#   - Layer 2: Flask Backend                   via OTLP push from app container
#   - Layer 3: Celery Workers                  via OTLP push from app container
#   - Layer 4: Outbound HTTP (requests lib)    via OTLP push from app container
#   - Layer 5: Browser Web Vitals              via OTLP push from browser (CORS-enabled)
#   - Layer 6: Nginx Edge Proxy                via gRPC push from ngx_otel_module
#   - Layer 7: OpenAI LLM                      via OTLP push from app container
#   - Layer 8: PostgreSQL & Redis Internals    via native receiver scraping
#
# PREREQUISITES: All services (db, redis) must be on the iqoqo_default Docker network
# and the Docker socket must be accessible to the collector container.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # Required to securely accept browser-side OTel traces (Layer 5)
          allowed_origins:
            - "https://iqoqo.cc"
            - "https://dev.iqoqo.cc"
            - "https://cc.iqoqo.app"
          allowed_headers:
            - "*"

  # Layer 8: Container resource metrics
  # Requires: docker socket mounted at /var/run/docker.sock inside the container.
  # In docker-compose.yml, add:
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  docker_stats:
    endpoint: "unix:///var/run/docker.sock"
    collection_interval: 10s
    env_vars_to_metric_labels:
      - COMPOSE_SERVICE

  # Layer 8: PostgreSQL internal engine health (dead tuples, cache hit ratio, index usage)
  # Requires: 'db' service reachable via Docker network DNS
  postgresql:
    endpoint: "db:5432"
    transport: tcp
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    databases:
      - "${POSTGRES_DB}"
    collection_interval: 10s
    tls:
      insecure: true

  # Layer 8: Redis memory fragmentation & eviction metrics
  # Requires: 'redis' service reachable via Docker network DNS
  redis:
    endpoint: "redis:6379"
    collection_interval: 10s

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  # Export all 3 pillars (traces, metrics, logs) to OpenObserve's native OTLP endpoint.
  # Authorization header = Basic base64("${OPENOBSERVE_ROOT_USER:-admin@iqoqo.local}:${OPENOBSERVE_ROOT_PASSWORD:-supersecret}")
  # Default value: base64(admin@iqoqo.local:supersecret)
  otlphttp/openobserve:
    endpoint: "http://openobserve:5080/api/default/"
    headers:
      Authorization: "Basic ${OPENOBSERVE_BASIC_AUTH}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
    metrics:
      # Layers 1-7 push OTLP metrics; Layer 8 comes from native receivers
      receivers: [otlp, postgresql, redis, docker_stats]
      processors: [batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
