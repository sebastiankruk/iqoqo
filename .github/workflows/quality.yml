name: Code Quality

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy isort
          pip install -r requirements.txt

      - name: Run ruff
        run: ruff check app/ tests/ scripts/

      - name: Run black
        run: black --check app/ tests/ scripts/

      - name: Run isort
        run: isort --check-only app/ tests/ scripts/

      - name: Run mypy
        run: mypy app/ tests/ scripts/
        continue-on-error: true # Start lenient

  lint-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          npm install -g eslint prettier stylelint stylelint-config-standard

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run Markdownlint
        run: markdownlint-cli2 "**/*.md" "!node_modules" "!.venv" "!frontend/node_modules" "!frontend/.next" "!.github" "!.pytest_cache" "!.agent" "!.agents" "!.gemini/skills" "!frontend/playwright-report" "!frontend/test-results"

  lint-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check license headers
        run: ./scripts/check_license.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine # Locked to match docker-compose.yml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iqoqo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iqoqo_test
          ADMIN_PASSWORD: dummy-admin-password
        run: pytest tests/ -v

  validate-release:
    if: startsWith(github.head_ref, 'release/') || startsWith(github.ref_name, 'release/') || startsWith(github.head_ref, 'hotfix/') || startsWith(github.ref_name, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Validate version consistency
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [[ $BRANCH == release/* ]]; then
            VERSION="${BRANCH#release/}"
          elif [[ $BRANCH == hotfix/* ]]; then
            VERSION=$(echo "$BRANCH" | sed -E 's|^hotfix/([^/]+).*|\1|')
          else
            VERSION="$BRANCH"
          fi
          python scripts/validate_release.py "$VERSION"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Vitest unit tests
        run: cd frontend && npm run test

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install BATS Framework
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run script tests
        run: |
          make test-scripts-python
          make test-scripts-bash

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test, test-frontend, test-scripts]
    env:
      ADMIN_PASSWORD: admin
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iqoqo_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iqoqo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Create Postgres schemas
        run: |
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS catalog;"
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS inventory;"
          psql "$DATABASE_URL" -c "CREATE SCHEMA IF NOT EXISTS auth;"

      - name: Prepare E2E database
        run: |
          python scripts/init_db.py --seed-file data/seed_example.json --reset
          ADMIN_PASSWORD=admin PYTHONPATH=. python scripts/init_auth.py
          PYTHONPATH=. python tests/e2e/scripts/seed_e2e.py
        env:
          SECRET_KEY: test-secret-key-not-for-production
          ADMIN_PASSWORD: admin

      - name: Run Playwright E2E tests
        run: cd frontend && npx playwright test --project=chromium
        env:
          CI: true
          FLASK_API_URL: http://127.0.0.1:5002/api
          ADMIN_PASSWORD: admin
          SECRET_KEY: test-secret-key-not-for-production

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
