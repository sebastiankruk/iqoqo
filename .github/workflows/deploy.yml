name: Deploy Environments

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iqoqo-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Extract metadata (tags) for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/iqoqo-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-preview:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Trigger Preview Deployment
        run: |
          echo "### SECURE DEPLOYMENT INSTRUCTIONS ###"
          echo "To automate deployment to your Ubuntu box securely:"
          echo "1. Go to Repository Settings -> Environments -> 'preview'."
          echo "2. Add 'Deployment Branch Policy' to allow only 'main'."
          echo "3. Add Secrets: SSH_HOST, SSH_USER, SSH_KEY."
          echo "4. Use 'appleboy/ssh-action' in this step to connect and run:"
          echo "   cd /path/to/iqoqo && ./run.sh preview --prebuilt"
          echo "#######################################"

  deploy-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Production Deployment
        run: |
          echo "### SECURE DEPLOYMENT INSTRUCTIONS ###"
          echo "To automate deployment to your Ubuntu box securely:"
          echo "1. Go to Repository Settings -> Environments -> 'production'."
          echo "2. Add 'Deployment Branch Policy' to allow only protected tags (v*)."
          echo "3. Add Secrets: SSH_HOST, SSH_USER, SSH_KEY."
          echo "4. Use 'appleboy/ssh-action' in this step to connect and run:"
          echo "   cd /path/to/iqoqo && ./run.sh prod --prebuilt"
          echo "#######################################"
