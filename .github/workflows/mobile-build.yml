name: Mobile Sideload Build

# Builds unsigned APK (Android) and an unsigned IPA + .xcarchive (iOS) for
# direct sideloading — no App Store or Google Play submission required.
#
# Triggered on tags matching v1.*, release/1.* branches, or manually.

on:
  push:
    tags: ["v1.*"]
    branches: ["release/1.*"]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Android — produces a debug APK for direct ADB / sideload installation
  # ---------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build Next.js static export
        run: cd frontend && node scripts/build-capacitor.js

      - name: Sync Capacitor to Android project
        run: cd frontend && npx cap sync android

      - name: Build debug APK
        run: cd frontend/android && ./gradlew assembleDebug

      - name: Compute artifact tag
        id: vars
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqoqo-android-debug-${{ steps.vars.outputs.tag }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build signed release AAB (optional, secret-gated)
        if: ${{ env.HAS_SIGNING_SECRET == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > frontend/android/app/release.keystore
          cd frontend/android && ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD}"
          rm -f app/release.keystore

      - name: Upload signed AAB artifact (optional)
        if: ${{ env.HAS_SIGNING_SECRET == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: iqoqo-android-release-${{ steps.vars.outputs.tag }}
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ---------------------------------------------------------------------------
  # iOS — produces an unsigned .xcarchive and .ipa for sideloading.
  # Sideload with AltStore / Sideloadly or sign locally with Xcode.
  # ---------------------------------------------------------------------------
  build-ios:
    runs-on: macos-15
    env:
      HAS_SIGNING_SECRET: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build Next.js static export
        run: cd frontend && node scripts/build-capacitor.js

      - name: Sync Capacitor to iOS project
        run: cd frontend && npx cap sync ios

      - name: Compute artifact tag
        id: vars
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build unsigned xcarchive and package ipa
        # CODE_SIGNING_ALLOWED=NO produces a signable archive without requiring
        # provisioning profiles in CI. Package into Payload/App.app for AltStore/Sideloadly.
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cd frontend/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ runner.temp }}/iqoqo.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

          mkdir -p "${{ runner.temp }}/Payload"
          cp -R "${{ runner.temp }}/iqoqo.xcarchive/Products/Applications/App.app" "${{ runner.temp }}/Payload/"
          cd "${{ runner.temp }}"
          zip -qr "iqoqo-ios-sideload-${TAG}.ipa" Payload
          zip -qr "iqoqo-ios-xcarchive-${TAG}.zip" iqoqo.xcarchive

      - name: Upload iOS sideload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iqoqo-ios-sideload-${{ steps.vars.outputs.tag }}
          path: |
            ${{ runner.temp }}/iqoqo-ios-sideload-*.ipa
            ${{ runner.temp }}/iqoqo-ios-xcarchive-*.zip
          retention-days: 30

      - name: Sign iOS archive (optional, secret-gated)
        if: ${{ env.HAS_SIGNING_SECRET == 'true' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "Signing certificate configured; preparing signed IPA export."
          KEYCHAIN_PATH="${{ runner.temp }}/build.keychain-db"
          echo "${APPLE_CERTIFICATE_P12}" | base64 -d > "${{ runner.temp }}/cert.p12"
          security create-keychain -p ci-temp-keychain "${KEYCHAIN_PATH}"
          security import "${{ runner.temp }}/cert.p12" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${{ runner.temp }}/cert.p12"

  # ---------------------------------------------------------------------------
  # Standalone Installer — packages iqoqo_installer.py + sha256sum checksum
  # ---------------------------------------------------------------------------
  package-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute installer SHA-256 checksum
        run: |
          mkdir -p "${{ runner.temp }}/installer"
          cp scripts/iqoqo_installer.py "${{ runner.temp }}/installer/iqoqo_installer.py"
          (cd "${{ runner.temp }}/installer" && sha256sum iqoqo_installer.py > iqoqo_installer.py.sha256)

      - name: Upload installer & checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: iqoqo-installer-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/installer/iqoqo_installer.py
            ${{ runner.temp }}/installer/iqoqo_installer.py.sha256
          retention-days: 30
