name: Release and Publish

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  release:
    # Only run if the PR was merged (not just closed) AND the branch started with 'release/'
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pyproject.toml
        id: extract_version
        run: |
          python - << 'PY'
          import os
          import pathlib
          import tomllib

          pyproject_path = pathlib.Path("pyproject.toml")
          with pyproject_path.open("rb") as fp:
              data = tomllib.load(fp)

          try:
              version = data["project"]["version"]
          except KeyError as exc:
              raise SystemExit(f"Unable to read [project].version from {pyproject_path}") from exc

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env_file:
              env_file.write(f"VERSION={version}\n")

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output_file:
              output_file.write(f"version={version}\n")
          PY

      - name: Extract Release Notes from CHANGELOG
        id: extract_notes
        run: |
          python scripts/extract_changelog.py ${{ env.VERSION }} > release_notes.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iqoqo-backend:latest
            ghcr.io/${{ github.repository_owner }}/iqoqo-backend:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iqoqo-frontend:latest
            ghcr.io/${{ github.repository_owner }}/iqoqo-frontend:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
