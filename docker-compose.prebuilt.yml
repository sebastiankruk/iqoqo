# Override file: pull pre-built images from GitHub Container Registry
# Usage: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up
# Note: Requires Docker Compose v2.24+ (User's v5.1.3 is likely a version string including Engine version, compatible)
services:
  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-sebastiankruk/iqoqo}/backend:${APP_VERSION:-latest}
    build: !reset null

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-sebastiankruk/iqoqo}/backend:${APP_VERSION:-latest}
    build: !reset null

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-sebastiankruk/iqoqo}/frontend:${APP_VERSION:-latest}
    build: !reset null
